[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogclews-link"
version = "0.0.1"
authors = [
    {name = "Marcelo LaFleur"},
]
description = "Coupling layer linking OG-Core (OLG-CGE macro) and CLEWS/OSeMOSYS (least-cost energy-land-water)"
readme = "README.md"
requires-python = ">=3.11, <3.14"
keywords = [
    "OG-Core",
    "CLEWS",
    "OSeMOSYS",
    "energy-economy coupling",
    "overlapping generations",
    "soft link",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# ogclews-link is a STANDALONE, modular component: its own uv venv + uv.lock, isolated from the
# MUIOGO / OG-model environments. It does NOT depend on ogcore or any country OG package: to solve, it
# looks the country up in the model registry and SUBPROCESSES that model's own interpreter (see
# runtime.py + og_runner.py), exchanging data files. So this env is numpy/pandas/scipy/matplotlib only --
# the channel transforms, registry, and boundary serialization import + unit-test fast with no solver.
dependencies = [
    "numpy",
    "pandas>=1.2.5",
    "scipy>=1.7.1",
    "openpyxl>=3.1.2",   # read the CLEWS cost-of-electricity workbooks
    "matplotlib",        # the figure/deck subpackage (python -m ogclews_link.viz)
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "pytest-xdist", "ruff>=0.16,<0.17"]  # ruff pinned to a minor: default rule set moves between minors

[project.scripts]
ogclews-link = "ogclews_link.cli:main"

[project.urls]
Homepage = "https://github.com/marcelolafleur/ogclews-link"

[tool.setuptools.packages.find]
include = ["ogclews_link*"]              # catches ogclews_link AND ogclews_link.viz

[tool.setuptools.package-data]
ogclews_link = ["data/*.json", "data/*.csv", "demographic_data/*.csv"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff.lint]
# ruff's 0.16 defaults, plus BLE so the codebase's documented `noqa: BLE001` tolerances
# (deliberate catch-alls in readers that must never break a run) are honored, not dead.
extend-select = ["BLE"]
ignore = [
    "S110",   # try-except-pass: deliberate tolerant readers, each commented in place
    "SIM115", # open() without context manager: short-lived reads, closed by refcount
    "C408",   # dict()/list() calls over literals: house style
    "EXE001", # shebang without +x bit: scripts are documented as `python <file>` invocations
]

[tool.ruff.lint.per-file-ignores]
# the standalone installer runs under ANY system python (>=3.8), outside the link venv:
# %-formatting stays (no modern-syntax upgrades) and subprocess returncodes are checked manually
"scripts/setup.py" = ["UP031", "PLW1510"]
# test helpers use range()/tuple defaults deliberately (immutable, never mutated)
"tests/*" = ["B008"]
